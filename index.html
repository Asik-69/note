<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahi's Notes App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background Glow Elements -->
    <div class="glow-bg blob-1"></div>
    <div class="glow-bg blob-2"></div>

    <div class="app-card">

        <!-- Top Header & Watermark -->
        <header class="app-header">
            <div>
                <h1>Notes Hub</h1>
                <p class="subtext">Organize your thoughts with ease</p>
            </div>
            <div class="brand-badge">
                <span class="dot"></span>
                Dev: <strong class="dev-name">Asik Ahamed</strong>
            </div>
        </header>

        <!-- Form Section -->
        <div class="note-form">
            <input type="text" id="noteTitle" placeholder="Title..." autocomplete="off">
            <textarea id="noteDescription" placeholder="Take a note..."></textarea>

            <div class="form-action">
                <p id="message"></p>
                <button id="addButton">
                    <span>+ Add Note</span>
                </button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Search Bar -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search notes...">
        </div>

        <div class="section-header">
            <h2>Your Notes</h2>
        </div>

        <!-- Notes Grid -->
        <div id="notesContainer"></div>

        <!-- Footer Watermark -->
        <footer class="app-footer">
            Designed & Developed by <span class="highlight-name">ASIK AHAMED</span>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
